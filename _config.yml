# -----------------------------------------------------------------------------
# 빌드 설정 파일입니다. 콘텐츠는 여기에 두지 않습니다.
#   연구실 이름·이메일 등 → _data/lab.yml
#   화면 문구            → _data/strings.yml
#   디자인 값            → assets/css/tokens.css
#   구조 설명            → docs/CONTENT_MODEL.md
# -----------------------------------------------------------------------------
lang: en
timezone: Asia/Seoul

# 배포 주소. baseurl은 GitHub Actions가 자동으로 넣어 주므로 비워 둡니다.
# (학교 도메인을 연결해도 수정할 필요 없음)
url: ""
baseurl: ""

# -----------------------------------------------------------------------------
# 콘텐츠 컬렉션 (al-folio 방식)
#   _news/     : 홈 화면 Latest news
#   _projects/ : Research 페이지 연구 주제 + 홈 화면 연구 카드
# 두 컬렉션 모두 별도 페이지는 만들지 않고, 목록 화면에서만 사용합니다.
# -----------------------------------------------------------------------------
collections:
  news:
    output: false
  projects:
    output: false

include: ["_pages"]
exclude:
  - README.md
  - CHANGELOG.md
  - docs
  - Gemfile
  - Gemfile.lock
  - vendor
  - .github

# -----------------------------------------------------------------------------
# Markdown
# -----------------------------------------------------------------------------
markdown: kramdown
kramdown:
  input: GFM
  hard_wrap: false

# -----------------------------------------------------------------------------
# 논문 목록 (jekyll-scholar, al-folio와 같은 설정)
#   _bibliography/papers.bib 를 읽어 _layouts/bib.liquid 형식으로 출력합니다.
#   sort_by: none → bib 파일에 적힌 순서를 그대로 사용 (새 논문은 파일 맨 위에 추가)
# -----------------------------------------------------------------------------
plugins:
  - jekyll-scholar

scholar:
  style: apa
  locale: en
  source: /_bibliography/
  bibliography: papers.bib
  bibliography_template: bib
  bibtex_filters: [latex, smallcaps, superscript]
  replace_strings: true
  join_strings: true
  sort_by: none
  group_by: year
  group_order: descending
