# Lab Life 이벤트 목록 (Lab Life 페이지의 유일한 데이터)
# - 한 항목 = 이벤트 하나. 페이지에서는 날짜 최신순으로 자동 정렬되고 연도별로 묶입니다.
# - 파일 안의 순서는 상관없습니다. 날짜가 같으면 이 파일에 적힌 순서대로 표시됩니다.
#
# 새 이벤트 추가:
#   1) 사진을 assets/img/lab-life/ 에 올립니다 (예: 2026-05-teachers-day-1.jpg, 파일 이름에 공백 없이)
#   2) 아래 형식으로 항목을 추가합니다.
#
#   - title: 스승의 날
#     date: "2026-05"                  # "YYYY-MM" 또는 월을 모르면 "YYYY"
#     photos:                          # 첫 번째 사진이 대표(cover) 사진. 여러 장이면 클릭해서 넘겨 봅니다
#       - 2026-05-teachers-day-1.jpg
#       - 2026-05-teachers-day-2.jpg
#     cover_position: "center 60%"     # (선택) 대표 사진을 4:3으로 자를 때 보일 위치. 기본은 가운데
#
# 이벤트 삭제: 해당 항목을 지우고, 다른 곳에서 쓰지 않는 사진 파일은 지워도 됩니다.

